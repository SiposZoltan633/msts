<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: green;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Felső rész és menü */
.felso {
  background-color: rgba(51, 51, 51, 0.8);
  border-radius: 0 0 10px 10px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.felso h1 {
  color: black;
  text-align: center;
  margin: 0 0 10px 0;
}

/* Menü */
#ulb {
  list-style-type: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

#ulb li {
  margin: 5px;
}

#ulb li a {
  display: block;
  color: white;
  text-align: center;
  padding: 8px 12px;
  text-decoration: none;
  background-color: #555;
  border-radius: 8px;
  transition: background-color 0.3s;
}

#ulb li a:hover {
  background-color: #777;
}

#ulb li a.active {
  background-color: #04AA6D;
}

/* Tartalom */
.content {
  flex: 1;
  padding: 20px;
  color: white;
}

h2 {
  margin-top: 20px;
  margin-bottom: 5px;
}

.download-link {
  display: inline-block;
  margin-bottom: 5px;
  text-decoration: underline;
  color: white;
}

/* Reszponzív */
@media (max-width: 600px) {
  .felso h1 {
    font-size: 1.5em;
  }

  #ulb {
    flex-direction: column;
    align-items: center;
  }

  #ulb li a {
    width: 80%;
    text-align: center;
  }

  h2 {
    font-size: 1.2em;
  }
}
</style>
</head>
<body>

<div class="felso">
  <h1>Sound</h1>
  <ul id="ulb">
    <li><a href="https://siposzoltan633.github.io/msts/index.html">Főoldal</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/Activity.html">Feladatok,Activity</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/vonat.html">Járműpark</a></li>
    <li><a class="active" href="https://siposzoltan633.github.io/msts/sound.html">sound</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/kijelzo.html">kijelzo</a></li>
  </ul>
</div>

<div class="content">
  <h2>Bzmot</h2>
  <a href="https://drive.google.com/file/d/1uxzgqJ4Ds2DIW8FL_7CYpfssT5vP9hKA/view?usp=sharing"
     class="download-link" data-counter="bzmot">Bzmot sound</a>
  <p id="bzmot-counter">0 letöltés</p>

  <h2>Flirt</h2>
  <a href="https://drive.google.com/file/d/1NEydeU-NW7yDCtsF138IauA4Ujqzbamy/view?usp=share_link"
     class="download-link" data-counter="flirt">Flirt sound</a>
  <p id="flirt-counter">0 letöltés</p>

  <h2>Sulzer</h2>
  <a href="https://drive.google.com/file/d/11-OQQQiS330ug2N-7cCCb0nT6XYkkDQm/view?usp=share_link"
     class="download-link" data-counter="sulzer">Sulzer sound</a>
  <p id="sulzer-counter">0 letöltés</p>

  <h2>Szili</h2>
  <a href="https://drive.google.com/file/d/1XAJbEzAobih7N3AbMTYYR-mGOdQP_jEo/view?usp=share_link"
     class="download-link" data-counter="szili">Szili sound</a>
  <p id="szili-counter">0 letöltés</p>

  <h2>Stadler kiss 815</h2>
  <a href="https://drive.google.com/file/d/1Ib6ozzbdqj_12YLOeGyO-lR_rwtWfK0C/view?usp=sharing"
     class="download-link" data-counter="kiss815">Stadler Kiss 815 sound</a>
  <p id="kiss815-counter">0 letöltés</p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD35hrtc7Vs55IyUT3DLFB5xf6kPvtMvdw",
    authDomain: "mstsdowloadsclick.firebaseapp.com",
    databaseURL: "https://mstsdowloadsclick-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mstsdowloadsclick",
    storageBucket: "mstsdowloadsclick.firebasestorage.app",
    messagingSenderId: "991734193545",
    appId: "1:991734193545:web:2c62411b5201f022ed1558"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  document.querySelectorAll('.download-link').forEach(link => {
    const id = link.dataset.counter;
    const ref = db.ref('counters/' + id);

    ref.once('value').then(snap => {
      if (snap.val() === null) ref.set(0);
    });

    ref.on('value', snap => {
      const el = document.getElementById(id + '-counter');
      if (el) el.textContent = (snap.val() || 0) + " letöltés";
    });

    link.addEventListener('click', () => {
      ref.transaction(v => (v || 0) + 1);
    });
  });
</script>

</body>
</html>
