<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: green;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Felső rész és menü */
.felso {
  background-color: rgba(51, 51, 51, 0.8);
  border-radius: 0 0 10px 10px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.felso h1 {
  color: black;
  text-align: center;
  margin: 0 0 10px 0;
}

/* Menü */
#ulb {
  list-style-type: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

#ulb li {
  margin: 5px;
}

#ulb li a {
  display: block;
  color: white;
  text-align: center;
  padding: 8px 12px;
  text-decoration: none;
  background-color: #555;
  border-radius: 8px;
  transition: background-color 0.3s;
}

#ulb li a:hover {
  background-color: #777;
}

#ulb li a.active {
  background-color: #04AA6D;
}

/* Tartalom */
.content {
  flex: 1;
  padding: 20px;
  color: white;
}

h2 {
  margin-top: 20px;
  margin-bottom: 5px;
}

.download-link {
  display: inline-block;
  margin-bottom: 15px;
  text-decoration: underline;
  color: white;
}

/* Reszponzív */
@media (max-width: 600px) {
  .felso h1 {
    font-size: 1.5em;
  }

  #ulb {
    flex-direction: column;
    align-items: center;
  }

  #ulb li a {
    width: 80%;
    text-align: center;
  }

  h2 {
    font-size: 1.2em;
  }

  .download-link {
    display: block;
    margin-bottom: 10px;
  }
}
</style>
</head>
<body>

<div class="felso">
  <h1>Sound</h1>
  <ul id="ulb">
    <li><a href="https://siposzoltan633.github.io/msts/index.html">Főoldal</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/Activity.html">Feladatok,Activity</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/vonat.html">Járműpark</a></li>
    <li><a class="active" href="https://siposzoltan633.github.io/msts/sound.html">sound</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/kijelzo.html">kijelzo</a></li>
  </ul>
</div>

<div class="content">
  <h2>Bzmot</h2>
  <a href="https://drive.google.com/file/d/1HQrXk_0WoNC2FFASh7Aoc1H4lMndPl6L/view?usp=share_link" class="download-link">Bzmot sound</a>

  <h2>Flirt</h2>
  <a href="https://drive.google.com/file/d/1NEydeU-NW7yDCtsF138IauA4Ujqzbamy/view?usp=share_link" class="download-link">Flirt sound</a>

  <h2>Sulzer</h2>
  <a href="https://drive.google.com/file/d/11-OQQQiS330ug2N-7cCCb0nT6XYkkDQm/view?usp=share_link" class="download-link">Sulzer sound</a>

  <h2>Szili</h2>
  <a href="https://drive.google.com/file/d/1XAJbEzAobih7N3AbMTYYR-mGOdQP_jEo/view?usp=share_link" class="download-link">Szili sound</a>
</div>

</body>
</html>
