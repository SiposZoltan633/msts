<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Járműpark</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: yellow;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Felső rész és menü */
.felso {
  background-color: rgba(51, 51, 51, 0.8);
  border-radius: 0 0 10px 10px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.felso h1 {
  color: black;
  text-align: center;
  margin: 0 0 10px 0;
}

/* Menü */
#ulb {
  list-style-type: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

#ulb li {
  margin: 5px;
}

#ulb li a {
  display: block;
  color: white;
  text-align: center;
  padding: 8px 12px;
  text-decoration: none;
  background-color: #555;
  border-radius: 8px;
  transition: background-color 0.3s;
}

#ulb li a:hover {
  background-color: #777;
}

#ulb li a.active {
  background-color: #04AA6D;
}

/* Tartalom */
.content {
  flex: 1;
  padding: 20px;
}

h1.section-title {
  font-size: 1.8em;
  margin: 20px 0 10px 0;
  color: red;
}

.download-link {
  display: inline-block;
  text-decoration: underline;
  color: blue;
  cursor: pointer;
}

.counter {
  color: black;
  font-weight: bold;
  margin-top: 5px;
}

/* Reszponzív */
@media (max-width: 600px) {
  .felso h1 {
    font-size: 1.5em;
  }

  #ulb {
    flex-direction: column;
    align-items: center;
  }

  #ulb li a {
    width: 80%;
    text-align: center;
  }

  h1.section-title {
    font-size: 1.4em;
  }

  .counter {
    font-size: 14px;
  }
}
</style>
</head>
<body>

<div class="felso">
  <h1>Járműpark</h1>
  <ul id="ulb">
    <li><a href="https://siposzoltan633.github.io/msts/index.html">Főoldal</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/Activity.html">Feladatok,Activity</a></li>
    <li><a class="active" href="https://siposzoltan633.github.io/msts/vonat.html">Járműpark</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/sound.html">sound</a></li>
    <li><a href="https://siposzoltan633.github.io/msts/kijelzo.html">kijelzo</a></li>
  </ul>
</div>

<div class="content">
  <p>Taurus</p>
  <a href="https://drive.google.com/file/d/1RX3KwiENEKt3ZvUOU6DmlMvR0jvjMCLT/view?usp=share_link"
     target="_blank"
     class="download-link"
     data-counter="taurus">
    <h1 class="section-title">Karácsonyi ajándék</h1>
  </a>
  <p id="taurus-counter" class="counter">0 letöltés</p>

  <p>Bmx 3G festéssel (csak a 032-5-ös tartalmazza)</p>
  <a href="https://drive.google.com/file/d/1f5GTZWkBnnN3Yv1g1pz_5wQ6CElOjcgz/view?usp=drive_link"
     target="_blank"
     class="download-link"
     data-counter="bmx">
    bmx.png
  </a>
  <p id="bmx-counter" class="counter">0 letöltés</p>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  // Firebase konfiguráció
  const firebaseConfig = {
    apiKey: "AIzaSyD35hrtc7Vs55IyUT3DLFB5xf6kPvtMvdw",
    authDomain: "mstsdowloadsclick.firebaseapp.com",
    databaseURL: "https://mstsdowloadsclick-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mstsdowloadsclick",
    storageBucket: "mstsdowloadsclick.firebasestorage.app",
    messagingSenderId: "991734193545",
    appId: "1:991734193545:web:2c62411b5201f022ed1558",
    measurementId: "G-NGQTZKPR5F"
  };

  // Firebase inicializálás
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Letöltés számlálók
  const links = document.querySelectorAll('.download-link');

  links.forEach(link => {
    const counterId = link.dataset.counter;
    const counterRef = db.ref('counters/' + counterId);

    // Ha még nincs adat, hozzuk létre 0-val
    counterRef.once('value').then(snapshot => {
      if (snapshot.val() === null) counterRef.set(0);
    });

    // Valós idejű frissítés
    counterRef.on('value', snapshot => {
      const val = snapshot.val() || 0;
      const counterElem = document.getElementById(counterId + '-counter');
      if (counterElem) counterElem.textContent = val + " letöltés";
    });

    // Kattintásnál növelje a számlálót
    link.addEventListener('click', () => {
      counterRef.transaction(current => (current || 0) + 1);
    });
  });
</script>

</body>
</html>
