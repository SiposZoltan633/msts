body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: yellow;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Felső rész és menü */
.felso {
  background-color: rgba(51, 51, 51, 0.8);
  border-radius: 0 0 10px 10px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.felso h1 {
  color: black;
  text-align: center;
  margin: 0 0 10px 0;
}

/* Menü */
#ulb {
  list-style-type: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

#ulb li {
  margin: 5px;
}

#ulb li a {
  display: block;
  color: white;
  text-align: center;
  padding: 8px 12px;
  text-decoration: none;
  background-color: #555;
  border-radius: 8px;
  transition: background-color 0.3s;
}

#ulb li a:hover {
  background-color: #777;
}

#ulb li a.active {
  background-color: #04AA6D;
}

/* Tartalom */
.content {
  flex: 1;
  padding: 20px;
}

h1.section-title {
  font-size: 1.8em;
  margin: 20px 0 10px 0;
}

.download-link {
  display: inline-block;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  margin-bottom: 15px;
}

.download-link img {
  display: block;
  max-width: 100%;
  height: auto;
}

p {
  margin: 5px 0 15px 0;
}

/* RESPONSIVE nézet telefonokra */
@media (max-width: 600px) {
  .felso h1 {
    font-size: 1.5em;
  }

  #ulb {
    flex-direction: column;
    align-items: center;
  }

  #ulb li a {
    width: 80%;
    text-align: center;
  }

  h1.section-title {
    font-size: 1.5em;
  }

  p {
    font-size: 16px;
  }
}
