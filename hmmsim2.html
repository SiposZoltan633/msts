/* Felső rész és menü */
.felso {
  background-color: rgba(51, 51, 51, 0.8);
  border-radius: 0 0 10px 10px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.felso h1 {
  color: black;
  text-align: center;
  margin: 0 0 10px 0;
}

/* Menü */
#ulb {
  list-style-type: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

#ulb li {

#ulb li a {

  text-align: center;

  background-color: #555;

/* Tartalom */

}

h1.section-title {

  margin: 20px 0 10px 0;
}

.download-link {
  display: inline-block;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  margin-bottom: 15px;
}

.download-link img {
  display: block;
  max-width: 100%;
  height: auto;
}

p {

}

/* RESPONSIVE nézet telefonokra */
@media (max-width: 600px) {
  .felso h1 {
    font-size: 1.5em;
  }

  #ulb {
    flex-direction: column;
    align-items: center;
  }

  #ulb li a {
    width: 80%;
    text-align: center;
  }

  h1.section-title {

    <h1>Hmmsim2</h1>
    <p>Az oldal fejlesztés alatt áll</p>
    <p>Ez az app régebbi android verziókra készült nem garantált hogy nem kapsz hibát, régebbi rendszereken elfut(tesztelve volt).</p>
    <a href="https://drive.google.com/file/d/1pnOLN6EM9BweeOOK0g5AfRuo-g-tXcwZ/view?usp=sharing" target="_blank"
     class="download-link" data-counter="linkhmmsim2">Hmmsim2 letöltés</a>
    <p id="linkhmmsim2-counter">0 letöltés</p>

    <script>
  const firebaseConfig = {
    apiKey: "AIzaSyD35hrtc7Vs55IyUT3DLFB5xf6kPvtMvdw",
    authDomain: "mstsdowloadsclick.firebaseapp.com",
    databaseURL: "https://mstsdowloadsclick-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mstsdowloadsclick",
    storageBucket: "mstsdowloadsclick.firebasestorage.app",
    messagingSenderId: "991734193545",
    appId: "1:991734193545:web:2c62411b5201f022ed1558",
    measurementId: "G-NGQTZKPR5F"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const links = document.querySelectorAll('.download-link');
  links.forEach(link => {
    const counterId = link.dataset.counter;
    const counterRef = db.ref('counters/' + counterId);

    counterRef.once('value').then(snapshot => {
      if (snapshot.val() === null) counterRef.set(0);
    });

    counterRef.on('value', snapshot => {
      const val = snapshot.val() || 0;
      const counterElem = document.getElementById(counterId + '-counter');
      if(counterElem) counterElem.textContent = val + " letöltés";
    });

    link.addEventListener('click', function(e) {
      counterRef.transaction(current => (current || 0) + 1)
        .then(() => console.log('Számláló növelve: ' + counterId))
        .catch(err => console.error('Hiba a számláló növelésénél:', err));
    });
  });
</script>
