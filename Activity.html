<p id="szam">0 letöltés</p>

<script>
    const szamElem = document.getElementById('szam');
    const link = document.getElementById('noveles');

    let szam = 0;

    link.addEventListener('click', function(event) {
        szam++;                 
        szamElem.textContent = szam + " letöltés";
        window.open(link.href, '_blank'); // új ablakban nyitja a linket
    });
</script>
