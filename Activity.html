<script>
  // 🔹 Firebase konfiguráció
  const firebaseConfig = {
    apiKey: "AIzaSyD35hrtc7Vs55IyUT3DLFB5xf6kPvtMvdw",
    authDomain: "mstsdowloadsclick.firebaseapp.com",
    databaseURL: "https://mstsdowloadsclick-default-rtdb.europe-west1.firebasedatabase.app",

    storageBucket: "mstsdowloadsclick.firebasestorage.app",
    messagingSenderId: "991734193545",
    appId: "1:991734193545:web:2c62411b5201f022ed1558",
    measurementId: "G-NGQTZKPR5F"
  };

  // 🔹 Firebase inicializálás
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 🔹 Letöltő linkek kezelése
  const links = document.querySelectorAll('.download-link');
  links.forEach(link => {
    const counterId = link.dataset.counter;
    const counterRef = db.ref('counters/' + counterId);

    // Ha nincs érték, állítsd 0-ra
    counterRef.once('value').then(snapshot => {
      if (snapshot.val() === null) counterRef.set(0);
    });

    // Valós idejű frissítés
    counterRef.on('value', snapshot => {
      const val = snapshot.val() || 0;
      const counterElem = document.getElementById(counterId + '-counter');
      if(counterElem) counterElem.textContent = val + " letöltés";
    });

    // Kattintás esemény
    link.addEventListener('click', function(e) {
      counterRef.transaction(current => (current || 0) + 1)
        .then(() => console.log('Számláló növelve: ' + counterId))
        .catch(err => console.error('Hiba a számláló növelésénél:', err));
    });
  });
</script>
