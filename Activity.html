<script>
  // 🔹 A TE FIREBASE KONFIGURÁCIÓD ide:
  const firebaseConfig = {
    apiKey: "AIzaSyD35hrtc7Vs55IyUT3DLFB5xf6kPvtMvdw",
    authDomain: "mstsdowloadsclick.firebaseapp.com",
    databaseURL: "https://mstsdowloadsclick-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mstsdowloadsclick",
    storageBucket: "mstsdowloadsclick.appspot.com",
    messagingSenderId: "991734193545",
    appId: "1:991734193545:web:2c62411b5201f022ed1558",
    measurementId: "G-NGQTZKPR5F"
  };

  // 🔹 Firebase inicializálás
  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const szamElem = document.getElementById('szam');
  const link = document.getElementById('noveles');
  const counterRef = db.ref('counters/link5530'); // Egyedi azonosító a linkhez

  // 🔹 Valós idejű figyelés
  counterRef.on('value', snapshot => {
    const val = snapshot.val() || 0;
    szamElem.textContent = val + " letöltés";
  });

  // 🔹 Kattintáskor növelés és új ablakban nyitás
  link.addEventListener('click', function(event) {
    event.preventDefault();
    counterRef.transaction(current => (current || 0) + 1); // növelés
    window.open(link.href, '_blank'); // új ablak
  });
</script>
