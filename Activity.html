<script>
    // Lekérjük az összes letöltés linket
    const links = document.querySelectorAll('.download-link');

    links.forEach(function(link) {
        const id = link.getAttribute('data-id'); // egyedi azonosító minden linkhez
        const counterElem = document.getElementById('counter-' + id);

        // Betöltéskor ellenőrizzük, van-e már mentett szám localStorage-ben
        let szam = localStorage.getItem('counter-' + id);
        if (!szam) szam = 0;
        counterElem.textContent = szam + " letöltés";

        // Kattintás esemény
        link.addEventListener('click', function(event) {
            event.preventDefault(); // alap navigáció megakadályozása
            szam++;
            counterElem.textContent = szam + " letöltés";

            // Mentés localStorage-be, hogy megmaradjon az oldal újratöltése után
            localStorage.setItem('counter-' + id, szam);

            // Új ablakban nyitjuk meg a linket
            window.open(link.href, '_blank');
        });
    });
</script>
